<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Aphasia Assistant - Accessible Communication & Sentence Builder</title>
  <meta name="description" content="AI-powered communication assistant helping stroke survivors and people with aphasia convert partial words into natural sentences with speech synthesis." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            },
            emergency: {
              500: '#ef4444',
              600: '#dc2626',
              700: '#b91c1c'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            heading: ['Outfit', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300 min-h-screen flex flex-col">

  <!-- Top Emergency & Accessibility Banner -->
  <header id="top-bar" class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
      
      <!-- Brand & Title -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('landing')">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-sky-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <i data-lucide="message-square-heart" class="w-7 h-7"></i>
        </div>
        <div>
          <h1 class="font-heading text-xl font-extrabold text-slate-900 leading-tight flex items-center gap-2">
            AI Aphasia Assistant
            <span class="text-xs px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 font-bold border border-brand-200">v2.0</span>
          </h1>
          <p class="text-xs text-slate-500 font-medium">Communication & Sentence Builder</p>
        </div>
      </div>

      <!-- Center Action: Emergency Trigger -->
      <button id="emergency-banner-btn" onclick="triggerEmergencyModal()" class="btn-accessible btn-emergency px-5 py-2.5 rounded-2xl animate-pulse-emergency shadow-lg flex items-center gap-2 text-white">
        <i data-lucide="alert-triangle" class="w-6 h-6 animate-bounce"></i>
        <span class="font-extrabold tracking-wide hidden md:inline">EMERGENCY SOS</span>
        <span class="font-extrabold md:hidden">SOS</span>
      </button>

      <!-- Right Action Controls -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Language Switcher -->
        <button onclick="toggleLanguage()" id="lang-toggle-btn" class="btn-accessible btn-secondary px-3 py-2 text-sm rounded-xl font-bold flex items-center gap-2" title="Switch Language">
          <i data-lucide="globe" class="w-5 h-5 text-brand-600"></i>
          <span id="current-lang-text" class="hidden sm:inline">English (US)</span>
        </button>

        <!-- High Contrast Mode Toggle -->
        <button onclick="toggleHighContrast()" id="contrast-toggle-btn" class="p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center border border-slate-300" title="Toggle High Contrast Mode">
          <i data-lucide="sun" class="w-5 h-5"></i>
        </button>

        <!-- TTS Quick Voice Status -->
        <button onclick="stopTTS()" id="tts-stop-btn" class="hidden p-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold items-center gap-2 shadow-md">
          <i data-lucide="square" class="w-5 h-5"></i>
          <span class="text-xs font-bold hidden lg:inline">Stop Audio</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Layout Wrapper (Sidebar + Dynamic View Content) -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col md:flex-row gap-6">
    
    <!-- Sidebar Navigation (Desktop) -->
    <aside class="w-full md:w-64 shrink-0">
      <nav class="bg-white border border-slate-200 rounded-3xl p-3 shadow-sm flex md:flex-col gap-1 overflow-x-auto md:overflow-visible sticky top-28">
        
        <button onclick="navigateTo('landing')" id="nav-landing" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all text-left w-full">
          <i data-lucide="home" class="w-6 h-6 text-slate-500"></i>
          <span>Welcome Home</span>
        </button>

        <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all text-left w-full">
          <i data-lucide="layout-dashboard" class="w-6 h-6 text-slate-500"></i>
          <span>Dashboard</span>
        </button>

        <button onclick="navigateTo('assistant')" id="nav-assistant" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-brand-700 bg-brand-50 border border-brand-200 transition-all text-left w-full shadow-xs">
          <i data-lucide="sparkles" class="w-6 h-6 text-brand-600"></i>
          <span>AI Assistant</span>
        </button>

        <button onclick="navigateTo('builder')" id="nav-builder" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all text-left w-full">
          <i data-lucide="grid" class="w-6 h-6 text-slate-500"></i>
          <span>Phrase Builder</span>
        </button>

        <button onclick="navigateTo('favorites')" id="nav-favorites" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all text-left w-full">
          <i data-lucide="heart" class="w-6 h-6 text-slate-500"></i>
          <span>Favorites</span>
          <span id="fav-count-badge" class="ml-auto bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full text-xs font-extrabold">0</span>
        </button>

        <button onclick="navigateTo('history')" id="nav-history" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all text-left w-full">
          <i data-lucide="history" class="w-6 h-6 text-slate-500"></i>
          <span>History Log</span>
        </button>

        <div class="my-2 border-t border-slate-100 hidden md:block"></div>

        <button onclick="navigateTo('settings')" id="nav-settings" class="nav-item flex items-center gap-3.5 px-4 py-3.5 rounded-2xl font-bold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-all text-left w-full">
          <i data-lucide="sliders" class="w-6 h-6 text-slate-500"></i>
          <span>Settings</span>
        </button>

      </nav>
    </aside>

    <!-- Dynamic Main Content View Container -->
    <main id="main-content-area" class="flex-1 w-full min-w-0">
      <!-- Views injected dynamically by app.js -->
    </main>
  </div>

  <!-- Emergency Modal Overlay -->
  <div id="emergency-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full border-4 border-emergency-500 shadow-2xl space-y-6 fade-in">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <div class="flex items-center gap-3 text-emergency-600">
          <i data-lucide="alert-octagon" class="w-10 h-10 animate-bounce"></i>
          <h2 class="font-heading text-2xl font-black">EMERGENCY ASSIST</h2>
        </div>
        <button onclick="closeEmergencyModal()" class="p-2 text-slate-400 hover:text-slate-700 rounded-full hover:bg-slate-100">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <p class="text-slate-600 font-semibold text-base">Tap any emergency action below for immediate high-volume voice playback:</p>

      <div class="grid grid-cols-1 gap-3">
        <button onclick="speakEmergency('I need emergency medical help immediately!')" class="btn-accessible bg-red-600 hover:bg-red-700 text-white font-extrabold text-lg rounded-2xl p-4 flex items-center justify-between shadow-lg">
          <span class="flex items-center gap-3">
            <i data-lucide="ambulance" class="w-8 h-8"></i>
            I need medical help now!
          </span>
          <i data-lucide="volume-2" class="w-6 h-6"></i>
        </button>

        <button onclick="speakEmergency('I am in severe pain!')" class="btn-accessible bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-lg rounded-2xl p-4 flex items-center justify-between shadow-lg">
          <span class="flex items-center gap-3">
            <i data-lucide="activity" class="w-8 h-8"></i>
            I am in severe pain!
          </span>
          <i data-lucide="volume-2" class="w-6 h-6"></i>
        </button>

        <button onclick="speakEmergency('I fell down and cannot get up!')" class="btn-accessible bg-orange-600 hover:bg-orange-700 text-white font-extrabold text-lg rounded-2xl p-4 flex items-center justify-between shadow-lg">
          <span class="flex items-center gap-3">
            <i data-lucide="user-minus" class="w-8 h-8"></i>
            I fell down and need assistance!
          </span>
          <i data-lucide="volume-2" class="w-6 h-6"></i>
        </button>

        <button onclick="speakEmergency('Please call my family or caregiver right away!')" class="btn-accessible bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-lg rounded-2xl p-4 flex items-center justify-between shadow-lg">
          <span class="flex items-center gap-3">
            <i data-lucide="phone-call" class="w-8 h-8"></i>
            Call my caregiver now!
          </span>
          <i data-lucide="volume-2" class="w-6 h-6"></i>
        </button>
      </div>

      <div class="pt-2 text-center">
        <button onclick="closeEmergencyModal()" class="text-sm font-bold text-slate-500 hover:text-slate-800 underline">
          Cancel & Close Emergency Window
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Bar -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"></div>

  <!-- Audio Feedback & App Script -->
  <script src="app.js"></script>
</body>
</html>
